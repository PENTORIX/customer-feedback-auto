name: Update feedback index

on:
  push:
    paths:
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    if: "!contains(github.event.head_commit.message, '[feedback-index]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install pillow pytesseract

      - name: Build feedback index
        run: python .github/workflows/build_index.py

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback-index.json
          git diff --cached --quiet || git commit -m "chore: update feedback index [feedback-index]"
          git push
